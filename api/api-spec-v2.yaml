openapi: 3.0.3
info:
  title: Agent Name Service (ANS) Management API
  description: |
    Management API for the Agent Name Service (ANS) — v2.
    These management routes support versionless registrations. Newly constructed
    registration and lifecycle publications use V3, including successful updates
    to existing registrations; previously signed retries keep their original format.

    This API provides authenticated, ownership-scoped operations for managing
    ANS agent registrations, certificates, and lifecycle. It replaces the
    /v1/agents API with the following key changes:

    **Route structure:** All routes moved from `/v1/agents` to `/v2/ans/agents`.
    Registration uses `POST /v2/ans/agents` (standard REST collection POST,
    no `/register` verb suffix). Action endpoints (`/revoke`, `/verify-acme`,
    `/verify-dns`) retain verb suffixes for procedural clarity.

    **Management-scoped listing:** `GET /v2/ans/agents` returns only agents owned by
    the authenticated caller. Global search/discovery has moved to a dedicated
    search service.

    **Cursor-based pagination:** The list endpoint uses cursor-based pagination
    instead of offset-based, eliminating the O(n) performance degradation at
    high offsets.

    **Ownership enforcement:** All agent-specific operations (`GET /{agentId}`,
    `POST /{agentId}/revoke`, certificate endpoints) enforce that the
    authenticated caller owns the requested agent.

    **Resolution removed:** `POST /v1/agents/resolution` is not carried forward
    to v2. The `_ans` DNS TXT record already contains agent endpoints, making
    this endpoint redundant. Consumers needing discovery should use the
    registered agents search service (`/v1/ans/registered-agents`).

    ## Deprecation of v1

    All `/v1/agents/*` routes are deprecated and will be removed per the
    published sunset schedule. v1 responses include `Deprecation: true`,
    `Sunset`, and `Link` headers pointing to v2 equivalents.
  version: 2.0.0
  contact:
    name: ANS Working Group
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:18080/v2
    description: Local dev — quickstart ra-local.yaml
  - url: https://api.ans.example.org/v2
    description: Main ANS API server (v2)
  - url: https://test.ans.example.org/v2
    description: Test server (v2)

tags:
  - name: Management
    description: Agent listing and detail operations (ownership-scoped)
  - name: Registration
    description: Agent registration and validation operations
  - name: Revocation
    description: Agent certificate revocation operations
  - name: Certificate Management
    description: Certificate retrieval, CSR submission, and renewal operations
  - name: Verified Identities
    description: >
      OPTIONAL capability (ANS-0 §12.2). Owner-scoped verified-identity management — the
      operator/legal-entity "who" proven by control and linked to agents. An RA need not implement
      these routes at all and is still conformant; an RA that does implement them MUST follow the
      ANS-0 identity contract (the proof-of-control gate, the object model, links, and the sealed
      event family). The agent's FQDN primary anchor (the "what") is mandatory and lives under
      Registration, not here.

# Global security requirement. Every path inherits this and can
# override with `security: []` to declare itself anonymous. The
# handler's actual auth behaviour is documented in CLAUDE.md §Auth:
# static API key (Bearer <key>) for quickstart, OIDC bearer tokens
# when `auth.type: oidc` is configured. Both providers accept the
# same shape on the wire, which is why a single HTTP-bearer scheme
# covers both in the OpenAPI document.
security:
  - bearerAuth: []

paths:
  # ──────────────────────────────────────────────────────────────────
  # Management — ownership-scoped
  # ──────────────────────────────────────────────────────────────────
  /ans/agents:
    get:
      tags:
        - Management
      summary: List caller's agents
      description: "Returns agents owned by the authenticated caller. This is a management\nendpoint, not a discovery/search\
        \ endpoint.\n\n**Key differences from v1 `GET /v1/agents`:**\n- Results are scoped to the authenticated caller's\
        \ agents only.\n- Uses cursor-based pagination (no `offset`).\n- Removed filters: `protocol`, `agentDisplayName`,\
        \ `version`.\n  Use the dedicated search service for discovery use cases.\n- Removed `totalCount` and `searchCriteria`\
        \ from response.\n\n**Pagination:** Use the `nextCursor` value from the response as the\n`cursor` query parameter\
        \ in the next request. When `hasMore` is false,\nthere are no more results.\n"
      operationId: listCallerAgents
      parameters:
        - name: status
          in: query
          description: 'Filter by agent lifecycle status. Can specify multiple values.

            Defaults to ACTIVE. Use ''ALL'' to return agents of any status.

            '
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AgentLifecycleStatusFilter'
        - name: agentHost
          in: query
          description: Filter by agent host domain (exact match)
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return (default 20, max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: 'Opaque pagination cursor from a previous response''s `nextCursor`.

            Omit for the first page.

            '
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Agent list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Registration
      summary: Register a new agent with the ANS
      description: 'Registers a new agent with the Agent Name Service.


        The Registration Authority (RA) validates the agent''s identity and

        submitted information, then interacts with the CA to issue certificates

        or validates provided (BYOC) server certificates.


        The identity CSR is optional. Exactly one of serverCsrPEM or

        serverCertificatePEM is required. An

        ACTIVE registration can add an identity credential later through

        the dedicated identity-certificate operation.


        Registration activation applies ANS-1 section 7.6. Reuse eligible account/domain proof, including DNS-01 parent
        scope. Without reusable proof, create pending validation and return its existing next steps; BYOC needs no
        CA order. Certificate admission and issuer-required challenges remain separate.'
      operationId: registerAgent
      requestBody:
        description: Agent registration request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegistrationRequest'
      responses:
        '202':
          description: Registration accepted, pending validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPending'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Agent ID or ANSName already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid registration request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ans/agents/{agentId}:
    get:
      tags:
        - Management
      summary: Get agent details
      description: |
        Retrieves detailed information about a registered agent.

        **Ownership enforced:** Returns 404 if the authenticated caller does
        not own the requested agent.
      operationId: getAgent
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Agent details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetails'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────────────────────────
  # Registration Validation
  # ──────────────────────────────────────────────────────────────────
  /ans/agents/{agentId}/profile:
    get:
      tags:
        - Management
      summary: Read the owner-scoped profile resource and ETag
      operationId: getAgentProfile
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Accepted local resource; it may still await TL publication.
          headers:
            ETag:
              description: Strong ETag for this resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
    put:
      tags:
        - Management
      summary: Replace the owner-scoped profile resource
      description: 'Replaces the complete resource for an eligible ACTIVE registration using If-Match. A changed result
        is durably accepted for publication as AGENT_UPDATED.


        At mutation commit, apply ANS-1 section 7.6 account/domain proof reuse, including eligible DNS-01 ancestor
        grants. No new ANS challenge is needed for covered BYOC within the reuse window. If no proof is reusable,
        return 409 DOMAIN_REVALIDATION_REQUIRED without changing the existing registration. Proof age never gates
        runtime status.'
      operationId: updateAgentProfile
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/ResourceIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfile'
      responses:
        '202':
          description: Accepted locally; publication is pending for a changed resource. No-op returns the same ETag
            without another event.
          headers:
            ETag:
              description: Strong ETag for this resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPublication'
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          $ref: '#/components/responses/RegistrationUpdateConflict'
        '412':
          description: 'PROFILE_CHANGED: stale resource ETag.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidRegistrationUpdate'
        '428':
          $ref: '#/components/responses/UpdatePreconditionRequired'
        '503':
          $ref: '#/components/responses/PublicationUnavailable'

  /ans/agents/{agentId}/endpoints:
    get:
      tags:
        - Management
      summary: Read the owner-scoped endpoints resource and ETag
      operationId: getAgentEndpoints
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Accepted local resource; it may still await TL publication.
          headers:
            ETag:
              description: Strong ETag for this resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCollection'
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
    put:
      tags:
        - Management
      summary: Replace the owner-scoped endpoints resource
      description: 'Replaces the complete resource for an eligible ACTIVE registration using If-Match. A changed result
        is durably accepted for publication as AGENT_UPDATED.


        At mutation commit, apply ANS-1 section 7.6 account/domain proof reuse, including eligible DNS-01 ancestor
        grants. No new ANS challenge is needed for covered BYOC within the reuse window. If no proof is reusable,
        return 409 DOMAIN_REVALIDATION_REQUIRED without changing the existing registration. Proof age never gates
        runtime status.'
      operationId: updateAgentEndpoints
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/ResourceIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointCollection'
      responses:
        '202':
          description: Accepted locally; publication is pending for a changed resource. No-op returns the same ETag
            without another event.
          headers:
            ETag:
              description: Strong ETag for this resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPublication'
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          $ref: '#/components/responses/RegistrationUpdateConflict'
        '412':
          description: 'ENDPOINTS_CHANGED: stale resource ETag.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/InvalidRegistrationUpdate'
        '428':
          $ref: '#/components/responses/UpdatePreconditionRequired'
        '503':
          $ref: '#/components/responses/PublicationUnavailable'

  /ans/agents/{agentId}/domain-validation:
    get:
      tags:
        - Management
      summary: Read reusable account/domain proof and pending validation
      operationId: getDomainValidation
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Account/domain proof and pending challenge state, separate from registration lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainValidationResponse'
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
      description: Owner-scoped view of proof eligible for this registration, including DNS-01 proof for an ancestor
        domain. A proof-window expiry never changes registration lifecycle, discovery or authentication. A pending
        challenge may coexist with an earlier reusable proof; the two domains are reported separately.
    post:
      tags:
        - Management
      summary: Start domain validation without certificate issuance
      operationId: startDomainValidation
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      description: Start owner-account validation without certificate issuance. domain defaults to agentHost; an explicit
        domain must equal that host or be a label-boundary ancestor, not a public suffix. DNS_01 is the default and
        grants parent/child reuse; HTTP_01 is allowed only for agentHost and grants exact-host reuse. Matching live
        account/domain/method challenges are idempotent; a different pending request returns 409 VALIDATION_CHANGED.
        Available to the owner of PENDING_VALIDATION, ACTIVE or DEPRECATED registrations, including computed certificate
        lapse. Existing proof remains usable until its own reuse deadline. BYOC paths first reuse eligible proof;
        invoking this operation for early refresh is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainValidationRequest'
      responses:
        '202':
          description: Account/domain proof and pending challenge state, separate from registration lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainValidationResponse'
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          description: Registration is terminal, or validationId no longer identifies an eligible request (VALIDATION_CHANGED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid domain, public-suffix target, unsupported challenge type, or HTTP_01 requested for
            an ancestor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ans/agents/{agentId}/domain-validation/verify:
    post:
      tags:
        - Management
      summary: Complete the pending domain-control challenge
      operationId: verifyDomainValidation
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      description: Check validationId, authenticated owner-account, requested domain/method, registration ownership
        and challenge expiry. Durably record the successful account/domain grant and return current proof state; no
        TL publication is needed to make the proof reusable. A completed-ID retry does not reset timestamps or overwrite
        newer proof. Completing validation does not apply a pending registration mutation; retry it against current
        state and preconditions. Proof expiry or verification failure never inactivates an existing registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainValidationVerificationRequest'
      responses:
        '401':
          $ref: '#/components/responses/ManagementAuthenticationRequired'
        '403':
          $ref: '#/components/responses/RegistrationNotOwned'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          description: Registration is terminal, or validationId no longer identifies an eligible request (VALIDATION_CHANGED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ACME_CHALLENGE_MISSING or ACME_CHALLENGE_EXPIRED. An early failed attempt does not erase still-valid
            proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Validation service unavailable; existing proof deadlines are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Account/domain proof recorded; current reusable proof state returned. Registration lifecycle
            is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainValidationResponse'

  /ans/agents/{agentId}/verify-acme:
    post:
      tags:
        - Registration
      summary: Trigger ACME validation
      description: Complete registration domain validation or reuse the authenticated account's eligible exact/ancestor
        proof under ANS-1 section 7.6. Covered BYOC does not repeat an ANS ACME challenge or create a CA order. Issuance
        may require its own issuer validation. Apply certificate admission, pending identity-CSR gating and the existing
        activation/DNS steps.
      operationId: validateRegistration
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '202':
          description: Validation successful, certificates pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ans/agents/{agentId}/verify-dns:
    post:
      tags:
        - Registration
      summary: Verify DNS records configured
      description: |
        Verifies that all required DNS records have been configured correctly.
        This is the final step for external domain registration.
      operationId: verifyDnsRecords
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '202':
          description: DNS verified, registration active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: DNS records not found or incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsVerificationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────────────────────────
  # Revocation
  # ──────────────────────────────────────────────────────────────────
  /ans/agents/{agentId}/revoke:
    post:
      tags:
        - Revocation
      summary: Revoke an active agent or cancel a pending registration
      description: |
        Revokes an active agent or cancels a pending registration.

        **Ownership enforced:** Returns 403 if caller does not own the agent.

        For ACTIVE agents: Revokes due to key compromise, decommissioning, or
        other security reasons. Certificate added to CRL, registry entry flagged.

        For PENDING registrations (PENDING_CERTS or PENDING_DNS): Cancels
        the registration, revokes any already-issued certificates.

        PENDING_VALIDATION registrations are not cancellable and will
        auto-expire.
      operationId: revokeAgent
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        description: Agent revocation request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRevocationRequest'
      responses:
        '200':
          description: Agent revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRevocationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed or caller does not own agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid revocation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────────────────────────
  # Certificate Management — Server
  # ──────────────────────────────────────────────────────────────────
  /ans/agents/{agentId}/certificates/server:
    get:
      tags:
        - Certificate Management
      summary: Get agent's server certificates
      description: Retrieves all TLS server certificates for the specified agent.
      operationId: getAgentServerCertificates
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Server certificate(s) retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent or certificate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Certificate Management
      summary: Submit server certificate CSR
      description: 'Submits a CSR for the agent''s server certificate.

        The response contains a `csrId` matching `CertificateResponse.csrId`.


        At mutation commit, apply ANS-1 section 7.6 account/domain proof reuse, including eligible DNS-01 ancestor
        grants. No new ANS challenge is needed for covered BYOC within the reuse window. If no proof is reusable,
        return 409 DOMAIN_REVALIDATION_REQUIRED without changing the existing registration. Proof age never gates
        runtime status.'
      operationId: submitServerCsr
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrSubmissionRequest'
      responses:
        '202':
          description: CSR accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrSubmissionResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid CSR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
